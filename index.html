<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quize app</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="box" id="canva">
    <div class="navDisplay">
      <div></div>
      <div class="title">
        Quiz
      </div>
      <div class="timer">
        <div id="time">01:00</div>
      </div>
    </div>
    

    <div class="nav">
      
    </div>

    <div class="questioBox">
      <!--QUESTION LOAD-->
    </div>
    <div class="pop-pare hidden">
      <div class="popup">
        <div class="title">QUIZ COMPLETE</div>
        <div class="result-info">
          <div class="result">Your Score</div>
          <div id="score"></div>
          <div id="percent"></div>
        </div>
        <div class="buttons">
          <button id="reviewQuestion">Review Questions</button>
          <button class="reset">Restart quize</button>
        </div>
        
      </div>
    </div>

    <div class="buttonBox">
      
    </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
